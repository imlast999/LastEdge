name: Ecosystem Orchestrator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-orchestrator:
    name: Orchestrator & Architecture (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Root Ecosystem
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Static Syntax Validation
        run: |
          python -m compileall cli.py tests scripts

      - name: Run Orchestrator Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Alert CI Failure to Telegram & Discord
        if: failure() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python scripts/notify_bots.py \
            --event ci-failure \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }} (Python ${{ matrix.python-version }})" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
