// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

ext {
    compileSdkVersion = 36
    minSdkVersion = 24
    targetSdkVersion = 36
    REACT_NATIVE_NODE_MODULES_DIR = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = new File(["node", "--print", "require.resolve('react-native-worklets/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    reactNativeAndroidRoot = file("${REACT_NATIVE_NODE_MODULES_DIR}/android")
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects {
  project.ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
    minSdkVersion = 24
    buildToolsVersion = "36.0.0"
  }
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      project.android {
        compileSdkVersion 36
        buildToolsVersion "36.0.0"
        defaultConfig {
          minSdkVersion 24
          targetSdkVersion 36
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
